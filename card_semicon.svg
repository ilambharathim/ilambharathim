<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #10B981; opacity: 0.7; }
        50% { stroke: #FFFFFF; opacity: 1; }
      }
      .card-bg {
        fill: #080D1A;
        stroke: #10B981;
        stroke-width: 1.8;
        rx: 22px;
        filter: drop-shadow(0 4px 14px rgba(16, 185, 129, 0.5));
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.3px;
      }
      .tech {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #10B981;
        letter-spacing: 1px;
      }
      .expand-hint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #10B981;
        letter-spacing: 1px;
      }
    </style>

    <radialGradient id="nebula_semicon" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080D1A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Curvy Floating Cosmic Card Body -->
  <g style="animation: floatCard 4s ease-in-out infinite;">
    <rect x="3" y="3" width="894" height="80" class="card-bg" />
    <rect x="3" y="3" width="894" height="80" rx="22" fill="url(#nebula_semicon)" />
    
    <!-- Twinkling stars inside the card -->
    <circle cx="298" cy="13" r="0.7" fill="#FFFFFF" opacity="0.66" /><circle cx="667" cy="41" r="0.8" fill="#FFFFFF" opacity="0.47" /><circle cx="737" cy="62" r="1.2" fill="#FFFFFF" opacity="0.27" /><circle cx="722" cy="27" r="1.2" fill="#FFFFFF" opacity="0.7" /><circle cx="611" cy="78" r="0.8" fill="#FFFFFF" opacity="0.28" /><circle cx="330" cy="54" r="1.5" fill="#FFFFFF" opacity="0.68" /><circle cx="55" cy="53" r="0.9" fill="#FFFFFF" opacity="0.35" /><circle cx="120" cy="53" r="1.4" fill="#FFFFFF" opacity="0.73" /><circle cx="431" cy="27" r="1.5" fill="#FFFFFF" opacity="0.34" /><circle cx="181" cy="30" r="1.5" fill="#FFFFFF" opacity="0.21" /><circle cx="769" cy="50" r="1.4" fill="#FFFFFF" opacity="0.45" /><circle cx="700" cy="39" r="0.9" fill="#FFFFFF" opacity="0.67" /><circle cx="125" cy="56" r="1.5" fill="#FFFFFF" opacity="0.72" /><circle cx="242" cy="33" r="1.4" fill="#FFFFFF" opacity="0.48" />

    <!-- Sparkle glitter -->
    <g transform="translate(870, 24) scale(0.9)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#10B981" opacity="0.9" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Icon & Titles -->
    <text x="28" y="36" class="title">Semiconductor Image Restoration — SEMICON India 2026</text>
    <text x="28" y="58" class="tech">PyTorch 2.0 • NAFNet • SEM Metrology • 35.10 dB PSNR • KLA Track</text>

    <!-- Pill Status Badge -->
    <g transform="translate(740, 22)">
      <rect width="125" height="24" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#10B981" />
      <text x="24" y="16" class="badge-text">SOTA WINNER</text>
    </g>

    <!-- Click to open prompt -->
    <text x="865" y="64" class="expand-hint" text-anchor="end">✦ TOUCH TO OPEN ▾</text>
  </g>
</svg>
