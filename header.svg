    <circle cx="446" cy="100" r="1.8" fill="#FFFFFF" style="animation: twinkleBright 2.2s ease-in-out 0.5s infinite;" filter="url(#starGlow)" />
    <circle cx="744" cy="13" r="2.2" fill="#38BDF8" style="animation: twinkleMid 3.7s ease-in-out 2.6s infinite;" filter="url(#blueGlow)" />
