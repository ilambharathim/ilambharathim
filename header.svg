  <!-- 7 Diffraction Spikes / Glowing Glitters -->
  <g transform="translate(140, 40) scale(1.4)" style="animation: cosmicSparkle 3.5s ease-in-out 0.4s infinite;">
      <!-- 4-point cosmic ray -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11" fill="#E0F2FE" opacity="0.9" />
      <!-- Diagonal subtle rays -->
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
    <g transform="translate(750, 35) scale(1.6)" style="animation: cosmicSparkle 3.5s ease-in-out 1.2s infinite;">
      <!-- 4-point cosmic ray -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11" fill="#E0F2FE" opacity="0.9" />
      <!-- Diagonal subtle rays -->
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
    <g transform="translate(880, 160) scale(1.2)" style="animation: cosmicSparkle 3.5s ease-in-out 2.1s infinite;">
      <!-- 4-point cosmic ray -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11" fill="#E0F2FE" opacity="0.9" />
      <!-- Diagonal subtle rays -->
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
    <g transform="translate(600, 210) scale(1.1)" style="animation: cosmicSparkle 3.5s ease-in-out 0.9s infinite;">
      <!-- 4-point cosmic ray -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11" fill="#E0F2FE" opacity="0.9" />
      <!-- Diagonal subtle rays -->
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
    <g transform="translate(490, 30) scale(1.3)" style="animation: cosmicSparkle 3.5s ease-in-out 2.7s infinite;">
      <!-- 4-point cosmic ray -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11" fill="#E0F2FE" opacity="0.9" />
      <!-- Diagonal subtle rays -->
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
    <g transform="translate(80, 205) scale(1.2)" style="animation: cosmicSparkle 3.5s ease-in-out 1.8s infinite;">
      <!-- 4-point cosmic ray -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11" fill="#E0F2FE" opacity="0.9" />
      <!-- Diagonal subtle rays -->
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
    <g transform="translate(380, 190) scale(1.0)" style="animation: cosmicSparkle 3.5s ease-in-out 3.2s infinite;">
      <!-- 4-point cosmic ray -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11" fill="#E0F2FE" opacity="0.9" />
      <!-- Diagonal subtle rays -->
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
    

  <!-- Glowing Constellation Circuit Paths -->
  <path d="M 530 40 L 660 40 L 700 75 L 870 75" stroke="#1E293B" stroke-width="1" fill="none" />
  <path d="M 530 40 L 660 40 L 700 75 L 870 75" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="35 110" fill="none" style="animation: circuitStream 4s linear infinite; filter: drop-shadow(0 0 5px #38BDF8);" />

  <path d="M 610 55 L 690 55 L 725 90 L 910 90" stroke="#1E293B" stroke-width="1" fill="none" />
  <path d="M 610 55 L 690 55 L 725 90 L 910 90" stroke="#34D399" stroke-width="1.5" stroke-dasharray="25 90" fill="none" style="animation: circuitStream 5s linear infinite; filter: drop-shadow(0 0 5px #34D399);" />

  <path d="M 40 215 L 140 215 L 180 185 L 290 185" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="20 80" fill="none" style="animation: circuitStream 3.5s linear infinite; filter: drop-shadow(0 0 5px #A78BFA);" />

  <!-- 3D Holographic Silicon Die Graphic on Right -->
  <g transform="translate(755, 100)" style="animation: diePulse 4s ease-in-out infinite;">
    <!-- Curvy Substrate -->
    <rect x="-65" y="-50" width="130" height="100" rx="14" fill="url(#dieGrad)" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Micro Balls / Pins -->
    <circle cx="-53" cy="-38" r="2.5" fill="#34D399" />
    <circle cx="-53" cy="38" r="2.5" fill="#38BDF8" />
    <circle cx="53" cy="-38" r="2.5" fill="#A78BFA" />
    <circle cx="53" cy="38" r="2.5" fill="#FBBF24" />

    <!-- Silicon Die Core -->
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#03060C" stroke="#34D399" stroke-width="1" />
    
    <text x="0" y="-11" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#38BDF8" text-anchor="middle">POLARFIRE SoC</text>
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E2E8F0" text-anchor="middle">RISC-V + SNN</text>
    <text x="0" y="19" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#34D399" text-anchor="middle">22nm FinFET</text>
    
    <!-- Wire Bonds -->
    <line x1="-65" y1="-20" x2="-78" y2="-20" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="-65" y1="0" x2="-78" y2="0" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="-65" y1="20" x2="-78" y2="20" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="65" y1="-20" x2="78" y2="-20" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="65" y1="0" x2="78" y2="0" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="65" y1="20" x2="78" y2="20" stroke="#38BDF8" stroke-width="1.5" />
  </g>

  <!-- Left Content Info -->
  <g transform="translate(45, 35)">
    <!-- Curvy Floating Status Capsule -->
    <rect width="195" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="15" cy="13" r="4" fill="#34D399" style="animation: twinkleBright 2s ease-in-out infinite;" />
    <text x="28" y="17" class="sub-pill">✦ COSMIC SILICON &amp; RTL</text>

    <!-- Main Name Heading with Supernova Glow -->
    <text x="0" y="75" class="title-text">ILAM BHARATHI</text>

    <!-- Subtitle -->
    <text x="2" y="105" class="sub-role">ECE Undergraduate • VLSI • RTL Design • FPGA • Hardware AI</text>

    <!-- Tagline -->
    <text x="2" y="129" class="sub-desc">Architecting hardware systems from transistor physics to intelligent edge accelerators.</text>
  </g>

  <!-- Bottom Divider Line with Nebula Glow -->
  <line x1="45" y1="198" x2="895" y2="198" stroke="#1E293B" stroke-width="1" />

  <!-- Bottom Flow Pipeline -->
  <g transform="translate(45, 222)">
    <text x="0" y="0" class="mono-flow" fill="#38BDF8" font-weight="bold">PIPELINE:</text>
    <text x="65" y="0" class="mono-flow">SPEC ➔ RTL DESIGN ➔ SIMULATION ➔ SYNTHESIS ➔ VERIFICATION ➔ SILICON</text>
  </g>

  <!-- Animated Cosmic Clock in Lower Right -->
  <g transform="translate(650, 220)">
    <text x="-55" y="0" class="mono-flow" fill="#34D399">CLK_EDGE</text>
    <path d="M 15 2 L 28 2 L 28 -8 L 41 -8 L 41 2 L 54 2 L 54 -8 L 67 -8 L 67 2 L 80 2 L 80 -8 L 93 -8 L 93 2 L 106 2 L 106 -8 L 119 -8 L 119 2 L 132 2 L 132 -8 L 145 -8 L 145 2 L 158 2 L 158 -8 L 171 -8 L 171 2 L 184 2 L 184 -8 L 197 -8 L 197 2 L 210 2" stroke="#38BDF8" stroke-width="1.5" fill="none" style="stroke-dasharray: 6 3; animation: clockScroll 6s linear infinite; filter: drop-shadow(0 0 3px #38BDF8);" />
  </g>
</svg>
