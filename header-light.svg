<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.28; }
      }
      @keyframes traceFlow {
        0% { stroke-dashoffset: 140; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0; }
        10% { opacity: 0.4; }
        90% { opacity: 0.4; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      @keyframes waveScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -160; }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .bg { fill: #F6F8FA; }
      .grid { stroke: #D0D7DE; stroke-width: 1; opacity: 0.4; }
      .trace { stroke: #D0D7DE; stroke-width: 1.5; fill: none; }
      .trace-flow {
        stroke: #0969DA;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 20 80;
        animation: traceFlow 4s linear infinite;
      }
      .trace-green {
        stroke: #1A7F37;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 15 90;
        animation: traceFlow 5s linear infinite;
      }
      .waveform {
        stroke: #0969DA;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 8 4;
        animation: waveScroll 8s linear infinite;
        opacity: 0.55;
      }
      .scan {
        stroke: #0969DA;
        stroke-width: 1;
        opacity: 0.2;
        animation: scanLine 9s linear infinite;
      }

      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 4px;
        fill: #1F2328;
      }
      .text-badge {
        font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
        font-size: 10.5px;
        letter-spacing: 1.2px;
        fill: #0969DA;
        font-weight: 600;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 14.5px;
        letter-spacing: 0.5px;
        fill: #1A7F37;
      }
      .text-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 0.2px;
        fill: #59636E;
      }
      .text-mono {
        font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
        font-size: 10px;
        fill: #59636E;
      }
      .node { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.5; }
      .node-lit { fill: #0969DA; }
      .node-green { fill: #1A7F37; }
      .status-dot { fill: #1A7F37; animation: statusBlink 2.5s ease-in-out infinite; }
    </style>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969DA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0"/>
    </linearGradient>

    <pattern id="ic-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" class="grid" />
      <line x1="0" y1="0" x2="0" y2="30" class="grid" />
      <circle cx="0" cy="0" r="1" fill="#D0D7DE" />
    </pattern>
  </defs>

  <rect width="920" height="250" rx="10" class="bg" stroke="#D0D7DE" stroke-width="1.2"/>
  <rect width="920" height="250" rx="10" fill="url(#ic-grid)" />
  <line x1="10" y1="5" x2="910" y2="5" class="scan" />

  <path d="M 650 25 L 760 25 L 790 50 L 890 50" class="trace" />
  <path d="M 650 25 L 760 25 L 790 50 L 890 50" class="trace-flow" />
  <path d="M 700 38 L 775 38 L 805 63 L 890 63" class="trace" />
  <path d="M 700 38 L 775 38 L 805 63 L 890 63" class="trace-green" />
  <circle cx="890" cy="50" r="3.5" class="node" />
  <circle cx="890" cy="63" r="3.5" class="node" />
  <circle cx="790" cy="50" r="2.5" class="node-lit" />
  <circle cx="805" cy="63" r="2.5" class="node-green" />

  <g transform="translate(40, 24)">
    <rect width="180" height="22" rx="4" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" class="status-dot" />
    <text x="26" y="15" class="text-badge">SYSTEM ACTIVE // RTL</text>
  </g>

  <text x="40" y="88" class="text-title">ILAM BHARATHI</text>
  <text x="42" y="116" class="text-subtitle">ECE Undergraduate • VLSI • RTL Design • FPGA • Hardware Acceleration</text>
  <text x="42" y="140" class="text-desc">Building and exploring hardware systems from transistor-level circuits to intelligent edge architectures.</text>

  <g transform="translate(675, 88)">
    <rect width="205" height="62" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text x="14" y="22" class="text-mono" fill="#0969DA" font-weight="bold">DEVICE &amp; ARCHITECTURE</text>
    <text x="14" y="38" class="text-mono" fill="#24292F">• Node: 22nm FinFET / 180nm</text>
    <text x="14" y="52" class="text-mono" fill="#24292F">• Target: PolarFire SoC FPGA</text>
  </g>

  <line x1="40" y1="172" x2="880" y2="172" stroke="url(#lineGrad)" stroke-width="1" />

  <g transform="translate(40, 204)">
    <text x="0" y="0" class="text-mono" fill="#0969DA" font-weight="600">FLOW:</text>
    <text x="45" y="0" class="text-mono">SPEC ➔ RTL ➔ SIMULATION ➔ SYNTHESIS ➔ VERIFICATION ➔ HARDWARE</text>
  </g>

  <path d="M 620 205 L 635 205 L 635 192 L 650 192 L 650 205 L 665 205 L 665 192 L 680 192 L 680 205 L 695 205 L 695 192 L 710 192 L 710 205 L 725 205 L 725 192 L 740 192 L 740 205 L 755 205 L 755 192 L 770 192 L 770 205 L 785 205 L 785 192 L 800 192 L 800 205 L 815 205 L 815 192 L 830 192 L 830 205 L 845 205 L 845 192 L 860 192 L 860 205 L 875 205" class="waveform" />
  <text x="570" y="202" class="text-mono" font-size="9" fill="#0969DA" opacity="0.7">CLK_REF</text>
</svg>
