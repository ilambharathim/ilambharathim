    <circle cx="649" cy="116" r="2.2" fill="#38BDF8" style="animation: twinkleMid 3.2s ease-in-out 2.9s infinite;" filter="url(#blueGlow)" />
    <circle cx="654" cy="92" r="0.8" fill="#94A3B8" opacity="0.4" />
    <circle cx="457" cy="88" r="1.8" fill="#FFFFFF" style="animation: twinkleBright 2.5s ease-in-out 3.8s infinite;" filter="url(#starGlow)" />
    <circle cx="422" cy="233" r="0.8" fill="#94A3B8" opacity="0.4" />
    <circle cx="604" cy="107" r="1.6" fill="#34D399" style="animation: twinkleBright 3.2s ease-in-out 1.6s infinite;" filter="url(#greenGlow)" />
