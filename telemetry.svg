<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0D1117; stroke: #30363D; stroke-width: 1.2; rx: 10px; }
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1; rx: 8px; }
      .card-glow { fill: #161B22; stroke: #58A6FF; stroke-width: 1.5; rx: 8px; }
      .label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; fill: #8B949E; letter-spacing: 1px; }
      .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #F0F6FC; }
      .val-green { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #3FB950; }
      .val-blue { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #58A6FF; }
      .val-purple { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #BC8CFF; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #7D8590; }
      .bar-bg { fill: #21262D; rx: 3px; }
      .bar-fill-blue { fill: #58A6FF; rx: 3px; }
      .bar-fill-green { fill: #3FB950; rx: 3px; }
      .bar-fill-purple { fill: #BC8CFF; rx: 3px; }
      .title-top { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #58A6FF; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="900" height="200" class="bg" />

  <!-- Top Title Bar -->
  <g transform="translate(25, 28)">
    <circle cx="6" cy="0" r="4" fill="#3FB950" />
    <text x="18" y="4" class="title-top">ENGINEERING TELEMETRY &amp; HARDWARE BENCHMARKS</text>
    <text x="850" y="4" class="label" text-anchor="end">SYSTEM STATUS: OPTIMAL</text>
    <line x1="0" y1="16" x2="850" y2="16" stroke="#21262D" stroke-width="1" />
  </g>

  <!-- 4 Metrics Columns -->
  <!-- Card 1: Skillrack -->
  <g transform="translate(25, 60)">
    <rect width="195" height="115" class="card" />
    <text x="16" y="28" class="label">SKILLRACK</text>
    <text x="16" y="60" class="val-blue">620+</text>
    <text x="16" y="78" class="sub">Algorithmic Problems</text>
    <rect x="16" y="92" width="163" height="6" class="bar-bg" />
    <rect x="16" y="92" width="135" height="6" class="bar-fill-blue" />
  </g>

  <!-- Card 2: LeetCode -->
  <g transform="translate(242, 60)">
    <rect width="195" height="115" class="card" />
    <text x="16" y="28" class="label">LEETCODE</text>
    <text x="16" y="60" class="val-green">210</text>
    <text x="16" y="78" class="sub">Contest Rating: 1449</text>
    <rect x="16" y="92" width="163" height="6" class="bar-bg" />
    <rect x="16" y="92" width="110" height="6" class="bar-fill-green" />
  </g>

  <!-- Card 3: Semiconductor Model -->
  <g transform="translate(460, 60)">
    <rect width="195" height="115" class="card" />
    <text x="16" y="28" class="label">METROLOGY SOTA</text>
    <text x="16" y="60" class="val-purple">35.10 dB</text>
    <text x="16" y="78" class="sub">PSNR (0.9885 SSIM)</text>
    <rect x="16" y="92" width="163" height="6" class="bar-bg" />
    <rect x="16" y="92" width="155" height="6" class="bar-fill-purple" />
  </g>

  <!-- Card 4: Hardware Target -->
  <g transform="translate(678, 60)">
    <rect width="195" height="115" class="card-glow" />
    <text x="16" y="28" class="label">EDGE PLATFORM</text>
    <text x="16" y="58" class="val" font-size="18">PolarFire SoC</text>
    <text x="16" y="78" class="sub">RISC-V + SNN Acceleration</text>
    <rect x="16" y="92" width="163" height="6" class="bar-bg" />
    <rect x="16" y="92" width="145" height="6" class="bar-fill-blue" />
  </g>
</svg>
