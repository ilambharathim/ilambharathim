<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 40" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkle0 { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      @keyframes twinkle1 { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
      @keyframes twinkle2 { 0%, 100% { opacity: 0.4; } 35% { opacity: 1; } }
      @keyframes lineGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #38BDF8); }
      }
    </style>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="80%" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Twinkling background stars -->
  <circle cx="423" cy="17" r="1.0" fill="#38BDF8" style="animation: twinkle0 1.9s ease-in-out 0.6s infinite;" />
  <circle cx="788" cy="7" r="1.1" fill="#FFFFFF" style="animation: twinkle1 2.5s ease-in-out 1.2s infinite;" />
  <circle cx="561" cy="7" r="1.7" fill="#FFFFFF" style="animation: twinkle2 2.1s ease-in-out 1.5s infinite;" />
  <circle cx="637" cy="23" r="1.0" fill="#38BDF8" style="animation: twinkle0 2.1s ease-in-out 2.7s infinite;" />
  <circle cx="407" cy="32" r="1.5" fill="#FFFFFF" style="animation: twinkle1 2.5s ease-in-out 0.5s infinite;" />
  <circle cx="880" cy="23" r="1.1" fill="#FFFFFF" style="animation: twinkle2 2.3s ease-in-out 2.8s infinite;" />
  <circle cx="803" cy="7" r="1.3" fill="#38BDF8" style="animation: twinkle0 1.9s ease-in-out 1.3s infinite;" />
  <circle cx="17" cy="18" r="1.0" fill="#FFFFFF" style="animation: twinkle1 2.3s ease-in-out 3.0s infinite;" />
  <circle cx="483" cy="21" r="1.7" fill="#FFFFFF" style="animation: twinkle2 3.0s ease-in-out 1.9s infinite;" />
  <circle cx="376" cy="9" r="1.0" fill="#38BDF8" style="animation: twinkle0 1.7s ease-in-out 2.8s infinite;" />
  <circle cx="820" cy="19" r="1.4" fill="#FFFFFF" style="animation: twinkle1 2.9s ease-in-out 3.0s infinite;" />
  <circle cx="686" cy="10" r="0.8" fill="#FFFFFF" style="animation: twinkle2 2.2s ease-in-out 0.2s infinite;" />
  <circle cx="849" cy="18" r="0.9" fill="#38BDF8" style="animation: twinkle0 1.6s ease-in-out 1.3s infinite;" />
  <circle cx="327" cy="24" r="0.8" fill="#FFFFFF" style="animation: twinkle1 2.3s ease-in-out 1.1s infinite;" />
  <circle cx="215" cy="33" r="1.6" fill="#FFFFFF" style="animation: twinkle2 1.8s ease-in-out 0.3s infinite;" />
  <circle cx="273" cy="22" r="1.2" fill="#38BDF8" style="animation: twinkle0 2.0s ease-in-out 2.3s infinite;" />
  <circle cx="721" cy="20" r="1.7" fill="#FFFFFF" style="animation: twinkle1 2.8s ease-in-out 0.5s infinite;" />
  <circle cx="624" cy="29" r="1.5" fill="#FFFFFF" style="animation: twinkle2 2.1s ease-in-out 1.9s infinite;" />
  <circle cx="108" cy="8" r="0.9" fill="#38BDF8" style="animation: twinkle0 1.8s ease-in-out 0.6s infinite;" />
  <circle cx="159" cy="34" r="1.0" fill="#FFFFFF" style="animation: twinkle1 2.7s ease-in-out 1.7s infinite;" />
  <circle cx="827" cy="12" r="1.6" fill="#FFFFFF" style="animation: twinkle2 2.7s ease-in-out 0.4s infinite;" />
  <circle cx="200" cy="26" r="0.9" fill="#38BDF8" style="animation: twinkle0 2.4s ease-in-out 0.9s infinite;" />
  <circle cx="58" cy="15" r="1.0" fill="#FFFFFF" style="animation: twinkle1 2.7s ease-in-out 1.3s infinite;" />
  <circle cx="418" cy="17" r="1.2" fill="#FFFFFF" style="animation: twinkle2 1.6s ease-in-out 1.2s infinite;" />
  <circle cx="910" cy="6" r="1.7" fill="#38BDF8" style="animation: twinkle0 2.1s ease-in-out 2.2s infinite;" />
  

  <!-- Glowing cosmic line -->
  <line x1="40" y1="20" x2="900" y2="20" stroke="url(#divGrad)" stroke-width="1.5" style="animation: lineGlow 4s ease-in-out infinite;" />

  <!-- Center galaxy diamond -->
  <g transform="translate(470, 20)">
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#A78BFA" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
</svg>
