<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleMid { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes twinkleBright { 0%, 100% { opacity: 0.2; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.25); } }
      @keyframes cosmicSparkle {
        0%, 100% { opacity: 0.35; transform: scale(0.7) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.3) rotate(90deg); filter: drop-shadow(0 0 8px #38BDF8); }
      }
      @keyframes circuitStream {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nebulaFloat {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        50% { transform: translate(15px, -8px) scale(1.08); opacity: 0.75; }
      }
      @keyframes diePulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45)); }
        50% { filter: drop-shadow(0 0 22px rgba(167, 139, 250, 0.85)); }
      }
      @keyframes clockScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      .bg { fill: #03060C; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 35px;
        letter-spacing: 5px;
        fill: #FFFFFF;
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.55));
      }
      .sub-pill {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        fill: #38BDF8;
        font-weight: 700;
      }
      .sub-role {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.5px;
        fill: #34D399;
      }
      .sub-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 13.5px;
        letter-spacing: 0.2px;
        fill: #94A3B8;
      }
      .mono-flow {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10px;
        fill: #64748B;
      }
    </style>

    <!-- Filters for glowing stars -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Realistic Cosmic Nebula Clouds -->
    <radialGradient id="nebulaBlue" cx="25%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#1E1B4B" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#03060C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#03060C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaCenter" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#03060C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Black Void -->
  <rect width="940" height="250" rx="16" class="bg" stroke="#1E293B" stroke-width="1.5" />

  <!-- Flowing Cosmic Nebula Dust Clouds -->
  <rect width="940" height="250" rx="16" fill="url(#nebulaBlue)" style="animation: nebulaFloat 8s ease-in-out infinite;" />
  <rect width="940" height="250" rx="16" fill="url(#nebulaPurple)" style="animation: nebulaFloat 10s ease-in-out infinite;" />
  <rect width="940" height="250" rx="16" fill="url(#nebulaCenter)" />

