<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #38BDF8; opacity: 0.7; }
        50% { stroke: #FFFFFF; opacity: 1; }
      }
      .card-bg {
        fill: #080D1A;
        stroke: #38BDF8;
        stroke-width: 1.8;
        rx: 22px;
        filter: drop-shadow(0 4px 14px rgba(56, 189, 248, 0.5));
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.3px;
      }
      .tech {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #38BDF8;
        letter-spacing: 1px;
      }
      .expand-hint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #38BDF8;
        letter-spacing: 1px;
      }
    </style>

    <radialGradient id="nebula_pll" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080D1A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Curvy Floating Cosmic Card Body -->
  <g style="animation: floatCard 4s ease-in-out infinite;">
    <rect x="3" y="3" width="894" height="80" class="card-bg" />
    <rect x="3" y="3" width="894" height="80" rx="22" fill="url(#nebula_pll)" />
    
    <!-- Twinkling stars inside the card -->
    <circle cx="578" cy="20" r="0.7" fill="#FFFFFF" opacity="0.8" /><circle cx="871" cy="9" r="1.6" fill="#FFFFFF" opacity="0.76" /><circle cx="884" cy="38" r="0.8" fill="#FFFFFF" opacity="0.49" /><circle cx="233" cy="59" r="1.5" fill="#FFFFFF" opacity="0.3" /><circle cx="17" cy="57" r="0.9" fill="#FFFFFF" opacity="0.67" /><circle cx="480" cy="44" r="1.1" fill="#FFFFFF" opacity="0.77" /><circle cx="817" cy="79" r="1.3" fill="#FFFFFF" opacity="0.49" /><circle cx="209" cy="45" r="0.9" fill="#FFFFFF" opacity="0.24" /><circle cx="768" cy="77" r="0.8" fill="#FFFFFF" opacity="0.39" /><circle cx="66" cy="69" r="1.2" fill="#FFFFFF" opacity="0.71" /><circle cx="176" cy="15" r="1.6" fill="#FFFFFF" opacity="0.25" /><circle cx="205" cy="16" r="1.2" fill="#FFFFFF" opacity="0.61" /><circle cx="255" cy="59" r="0.8" fill="#FFFFFF" opacity="0.73" /><circle cx="267" cy="13" r="1.3" fill="#FFFFFF" opacity="0.45" />

    <!-- Sparkle glitter -->
    <g transform="translate(870, 24) scale(0.9)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#38BDF8" opacity="0.9" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Icon & Titles -->
    <text x="28" y="36" class="title">4.8 GHz PLL Analog & Mixed-Signal Verification</text>
    <text x="28" y="58" class="tech">Cadence Virtuoso • Spectre • PFD • Charge Pump • Loop Filter • Jitter</text>

    <!-- Pill Status Badge -->
    <g transform="translate(740, 22)">
      <rect width="125" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#38BDF8" />
      <text x="24" y="16" class="badge-text">VERIFIED</text>
    </g>

    <!-- Click to open prompt -->
    <text x="865" y="64" class="expand-hint" text-anchor="end">✦ TOUCH TO OPEN ▾</text>
  </g>
</svg>
