<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #34D399; opacity: 0.7; }
        50% { stroke: #FFFFFF; opacity: 1; }
      }
      .card-bg {
        fill: #080D1A;
        stroke: #34D399;
        stroke-width: 1.8;
        rx: 22px;
        filter: drop-shadow(0 4px 14px rgba(52, 211, 153, 0.5));
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.3px;
      }
      .tech {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #34D399;
        letter-spacing: 1px;
      }
      .expand-hint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #34D399;
        letter-spacing: 1px;
      }
    </style>

    <radialGradient id="nebula_cdc" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080D1A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Curvy Floating Cosmic Card Body -->
  <g style="animation: floatCard 4s ease-in-out infinite;">
    <rect x="3" y="3" width="894" height="80" class="card-bg" />
    <rect x="3" y="3" width="894" height="80" rx="22" fill="url(#nebula_cdc)" />
    
    <!-- Twinkling stars inside the card -->
    <circle cx="788" cy="33" r="1.3" fill="#FFFFFF" opacity="0.44" /><circle cx="702" cy="55" r="1.1" fill="#FFFFFF" opacity="0.51" /><circle cx="138" cy="39" r="0.9" fill="#FFFFFF" opacity="0.4" /><circle cx="617" cy="78" r="0.9" fill="#FFFFFF" opacity="0.33" /><circle cx="87" cy="15" r="0.9" fill="#FFFFFF" opacity="0.74" /><circle cx="353" cy="17" r="1.2" fill="#FFFFFF" opacity="0.37" /><circle cx="512" cy="35" r="1.2" fill="#FFFFFF" opacity="0.63" /><circle cx="599" cy="68" r="0.9" fill="#FFFFFF" opacity="0.48" /><circle cx="431" cy="32" r="0.8" fill="#FFFFFF" opacity="0.6" /><circle cx="377" cy="62" r="1.1" fill="#FFFFFF" opacity="0.72" /><circle cx="70" cy="20" r="0.8" fill="#FFFFFF" opacity="0.64" /><circle cx="834" cy="21" r="0.9" fill="#FFFFFF" opacity="0.31" /><circle cx="474" cy="25" r="1.1" fill="#FFFFFF" opacity="0.37" /><circle cx="270" cy="17" r="1.1" fill="#FFFFFF" opacity="0.72" />

    <!-- Sparkle glitter -->
    <g transform="translate(870, 24) scale(0.9)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#34D399" opacity="0.9" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Icon & Titles -->
    <text x="28" y="36" class="title">180 nm CMOS Capacitance-to-Digital Converter</text>
    <text x="28" y="58" class="tech">Cadence Virtuoso • Spectre • 180nm Bulk CMOS • Switched-Capacitor PVT</text>

    <!-- Pill Status Badge -->
    <g transform="translate(740, 22)">
      <rect width="125" height="24" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#34D399" />
      <text x="24" y="16" class="badge-text">ANALOG AMS</text>
    </g>

    <!-- Click to open prompt -->
    <text x="865" y="64" class="expand-hint" text-anchor="end">✦ TOUCH TO OPEN ▾</text>
  </g>
</svg>
