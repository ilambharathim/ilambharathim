<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #38BDF8; opacity: 0.7; }
        50% { stroke: #FFFFFF; opacity: 1; }
      }
      .card-bg {
        fill: #080D1A;
        stroke: #38BDF8;
        stroke-width: 1.8;
        rx: 22px;
        filter: drop-shadow(0 4px 14px rgba(56, 189, 248, 0.5));
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.3px;
      }
      .tech {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #38BDF8;
        letter-spacing: 1px;
      }
      .expand-hint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #38BDF8;
        letter-spacing: 1px;
      }
    </style>

    <radialGradient id="nebula_riva" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080D1A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Curvy Floating Cosmic Card Body -->
  <g style="animation: floatCard 4s ease-in-out infinite;">
    <rect x="3" y="3" width="894" height="80" class="card-bg" />
    <rect x="3" y="3" width="894" height="80" rx="22" fill="url(#nebula_riva)" />
    
    <!-- Twinkling stars inside the card -->
    <circle cx="669" cy="22" r="0.7" fill="#FFFFFF" opacity="0.37" /><circle cx="243" cy="25" r="1.4" fill="#FFFFFF" opacity="0.61" /><circle cx="573" cy="19" r="1.2" fill="#FFFFFF" opacity="0.22" /><circle cx="110" cy="35" r="0.9" fill="#FFFFFF" opacity="0.56" /><circle cx="589" cy="33" r="1.3" fill="#FFFFFF" opacity="0.62" /><circle cx="444" cy="36" r="1.1" fill="#FFFFFF" opacity="0.37" /><circle cx="21" cy="28" r="1.3" fill="#FFFFFF" opacity="0.4" /><circle cx="174" cy="35" r="1.6" fill="#FFFFFF" opacity="0.4" /><circle cx="109" cy="56" r="0.8" fill="#FFFFFF" opacity="0.71" /><circle cx="633" cy="41" r="1.4" fill="#FFFFFF" opacity="0.64" /><circle cx="564" cy="23" r="1.6" fill="#FFFFFF" opacity="0.43" /><circle cx="580" cy="45" r="1.4" fill="#FFFFFF" opacity="0.57" /><circle cx="385" cy="32" r="1.3" fill="#FFFFFF" opacity="0.23" /><circle cx="248" cy="45" r="1.6" fill="#FFFFFF" opacity="0.71" />

    <!-- Sparkle glitter -->
    <g transform="translate(870, 24) scale(0.9)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#38BDF8" opacity="0.9" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Icon & Titles -->
    <text x="28" y="36" class="title">RIVA — RTL Intelligent Verification Assistant</text>
    <text x="28" y="58" class="tech">SystemVerilog • Logic Simulation • Waveform Analysis • Assertion Traps</text>

    <!-- Pill Status Badge -->
    <g transform="translate(740, 22)">
      <rect width="125" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#38BDF8" />
      <text x="24" y="16" class="badge-text">ACTIVE</text>
    </g>

    <!-- Click to open prompt -->
    <text x="865" y="64" class="expand-hint" text-anchor="end">✦ TOUCH TO OPEN ▾</text>
  </g>
</svg>
