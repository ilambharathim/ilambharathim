<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F14; stroke: #1F2D3D; stroke-width: 1.2; rx: 8px; }
      .grid { stroke: #1E293B; stroke-width: 0.8; stroke-dasharray: 2 4; }
      .sig-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #94A3B8; font-weight: 600; }
      .sig-clk { stroke: #38BDF8; stroke-width: 1.8; fill: none; }
      .sig-req { stroke: #34D399; stroke-width: 1.8; fill: none; }
      .sig-ack { stroke: #A78BFA; stroke-width: 1.8; fill: none; }
      .bus-wire { stroke: #FBBF24; stroke-width: 1.5; fill: none; }
      .bus-fill { fill: #1E293B; stroke: #FBBF24; stroke-width: 1; }
      .bus-txt { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #FBBF24; text-anchor: middle; }
      .title { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #38BDF8; letter-spacing: 1.2px; font-weight: bold; }
      .marker { stroke: #F43F5E; stroke-width: 1; stroke-dasharray: 3 3; }
      .marker-tag { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #F43F5E; }
    </style>
  </defs>

  <rect width="900" height="170" class="bg" />

  <!-- Top Trace Header -->
  <g transform="translate(20, 20)">
    <circle cx="6" cy="0" r="3.5" fill="#38BDF8" />
    <text x="18" y="3" class="title">RIVA SIMULATION TRACE // SYSTEMVERILOG ASSERTION VERIFIED (SVA: PASS)</text>
    <text x="860" y="3" class="sig-name" text-anchor="end" fill="#34D399">TIMING CLOSURE: 0 VIOLATIONS</text>
  </g>

  <!-- Grid lines -->
  <line x1="160" y1="35" x2="160" y2="160" class="grid" />
  <line x1="260" y1="35" x2="260" y2="160" class="grid" />
  <line x1="360" y1="35" x2="360" y2="160" class="grid" />
  <line x1="460" y1="35" x2="460" y2="160" class="grid" />
  <line x1="560" y1="35" x2="560" y2="160" class="grid" />
  <line x1="660" y1="35" x2="660" y2="160" class="grid" />
  <line x1="760" y1="35" x2="760" y2="160" class="grid" />

  <!-- Signal 1: clk -->
  <g transform="translate(20, 52)">
    <text x="0" y="8" class="sig-name">clk_core</text>
    <path d="M 140 10 L 165 10 L 165 0 L 190 0 L 190 10 L 215 10 L 215 0 L 240 0 L 240 10 L 265 10 L 265 0 L 290 0 L 290 10 L 315 10 L 315 0 L 340 0 L 340 10 L 365 10 L 365 0 L 390 0 L 390 10 L 415 10 L 415 0 L 440 0 L 440 10 L 465 10 L 465 0 L 490 0 L 490 10 L 515 10 L 515 0 L 540 0 L 540 10 L 565 10 L 565 0 L 590 0 L 590 10 L 615 10 L 615 0 L 640 0 L 640 10 L 665 10 L 665 0 L 690 0 L 690 10 L 715 10 L 715 0 L 740 0 L 740 10 L 765 10 L 765 0 L 790 0 L 790 10 L 815 10 L 815 0 L 840 0 L 840 10 L 860 10" class="sig-clk" />
  </g>

  <!-- Signal 2: rst_n -->
  <g transform="translate(20, 80)">
    <text x="0" y="8" class="sig-name">rst_n</text>
    <path d="M 140 10 L 190 10 L 195 0 L 860 0" class="sig-req" />
  </g>

  <!-- Signal 3: req / ack -->
  <g transform="translate(20, 108)">
    <text x="0" y="8" class="sig-name">fsm_valid</text>
    <path d="M 140 10 L 290 10 L 295 0 L 440 0 L 445 10 L 590 10 L 595 0 L 790 0 L 795 10 L 860 10" class="sig-ack" />
  </g>

  <!-- Signal 4: databus -->
  <g transform="translate(20, 136)">
    <text x="0" y="8" class="sig-name">data_bus[31:0]</text>
    <!-- Bus packets -->
    <polygon points="140,5 145,0 285,0 290,5 285,10 145,10" class="bus-fill" />
    <text x="215" y="8" class="bus-txt">0x0000_IDLE</text>

    <polygon points="290,5 295,0 435,0 440,5 435,10 295,10" class="bus-fill" stroke="#34D399" />
    <text x="365" y="8" class="bus-txt" fill="#34D399">0xAA55_PACKET_A</text>

    <polygon points="440,5 445,0 585,0 590,5 585,10 445,10" class="bus-fill" />
    <text x="515" y="8" class="bus-txt">0x0000_WAIT</text>

    <polygon points="590,5 595,0 785,0 790,5 785,10 595,10" class="bus-fill" stroke="#38BDF8" />
    <text x="690" y="8" class="bus-txt" fill="#38BDF8">0xCAFE_BURST_B</text>

    <polygon points="790,5 795,0 855,0 860,5 855,10 795,10" class="bus-fill" />
    <text x="825" y="8" class="bus-txt">IDLE</text>
  </g>

  <!-- Assertion Marker -->
  <line x1="295" y1="35" x2="295" y2="158" class="marker" />
  <text x="300" y="46" class="marker-tag">assert_handshake_valid</text>
</svg>
