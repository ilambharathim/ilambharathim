<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #A855F7; opacity: 0.7; }
        50% { stroke: #FFFFFF; opacity: 1; }
      }
      .card-bg {
        fill: #080D1A;
        stroke: #A855F7;
        stroke-width: 1.8;
        rx: 22px;
        filter: drop-shadow(0 4px 14px rgba(168, 85, 247, 0.5));
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.3px;
      }
      .tech {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #A855F7;
        letter-spacing: 1px;
      }
      .expand-hint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #A855F7;
        letter-spacing: 1px;
      }
    </style>

    <radialGradient id="nebula_snn" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080D1A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Curvy Floating Cosmic Card Body -->
  <g style="animation: floatCard 4s ease-in-out infinite;">
    <rect x="3" y="3" width="894" height="80" class="card-bg" />
    <rect x="3" y="3" width="894" height="80" rx="22" fill="url(#nebula_snn)" />
    
    <!-- Twinkling stars inside the card -->
    <circle cx="118" cy="56" r="1.0" fill="#FFFFFF" opacity="0.58" /><circle cx="388" cy="28" r="1.0" fill="#FFFFFF" opacity="0.33" /><circle cx="288" cy="17" r="1.2" fill="#FFFFFF" opacity="0.3" /><circle cx="761" cy="39" r="0.8" fill="#FFFFFF" opacity="0.43" /><circle cx="670" cy="79" r="0.9" fill="#FFFFFF" opacity="0.39" /><circle cx="801" cy="15" r="0.9" fill="#FFFFFF" opacity="0.22" /><circle cx="338" cy="59" r="0.9" fill="#FFFFFF" opacity="0.33" /><circle cx="595" cy="48" r="0.9" fill="#FFFFFF" opacity="0.5" /><circle cx="673" cy="66" r="0.8" fill="#FFFFFF" opacity="0.28" /><circle cx="777" cy="79" r="1.2" fill="#FFFFFF" opacity="0.65" /><circle cx="453" cy="59" r="1.0" fill="#FFFFFF" opacity="0.8" /><circle cx="156" cy="73" r="1.1" fill="#FFFFFF" opacity="0.65" /><circle cx="127" cy="27" r="1.3" fill="#FFFFFF" opacity="0.68" /><circle cx="447" cy="16" r="1.0" fill="#FFFFFF" opacity="0.56" />

    <!-- Sparkle glitter -->
    <g transform="translate(870, 24) scale(0.9)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#A855F7" opacity="0.9" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Icon & Titles -->
    <text x="28" y="36" class="title">SNN-Based Object Detection — Microchip PolarFire SoC</text>
    <text x="28" y="58" class="tech">Spiking Neural Networks • PolarFire SoC FPGA • RISC-V Acceleration</text>

    <!-- Pill Status Badge -->
    <g transform="translate(740, 22)">
      <rect width="125" height="24" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#A855F7" />
      <text x="24" y="16" class="badge-text">RESEARCH</text>
    </g>

    <!-- Click to open prompt -->
    <text x="865" y="64" class="expand-hint" text-anchor="end">✦ TOUCH TO OPEN ▾</text>
  </g>
</svg>
