<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #F59E0B; opacity: 0.7; }
        50% { stroke: #FFFFFF; opacity: 1; }
      }
      .card-bg {
        fill: #080D1A;
        stroke: #F59E0B;
        stroke-width: 1.8;
        rx: 22px;
        filter: drop-shadow(0 4px 14px rgba(245, 158, 11, 0.5));
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.3px;
      }
      .tech {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #F59E0B;
        letter-spacing: 1px;
      }
      .expand-hint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #F59E0B;
        letter-spacing: 1px;
      }
    </style>

    <radialGradient id="nebula_sram" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080D1A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Curvy Floating Cosmic Card Body -->
  <g style="animation: floatCard 4s ease-in-out infinite;">
    <rect x="3" y="3" width="894" height="80" class="card-bg" />
    <rect x="3" y="3" width="894" height="80" rx="22" fill="url(#nebula_sram)" />
    
    <!-- Twinkling stars inside the card -->
    <circle cx="494" cy="75" r="0.9" fill="#FFFFFF" opacity="0.53" /><circle cx="26" cy="22" r="1.3" fill="#FFFFFF" opacity="0.52" /><circle cx="288" cy="51" r="0.8" fill="#FFFFFF" opacity="0.46" /><circle cx="479" cy="8" r="1.6" fill="#FFFFFF" opacity="0.73" /><circle cx="284" cy="72" r="1.4" fill="#FFFFFF" opacity="0.5" /><circle cx="123" cy="46" r="1.5" fill="#FFFFFF" opacity="0.5" /><circle cx="218" cy="27" r="1.0" fill="#FFFFFF" opacity="0.3" /><circle cx="812" cy="75" r="1.5" fill="#FFFFFF" opacity="0.56" /><circle cx="515" cy="10" r="0.8" fill="#FFFFFF" opacity="0.42" /><circle cx="866" cy="47" r="0.9" fill="#FFFFFF" opacity="0.34" /><circle cx="595" cy="18" r="0.8" fill="#FFFFFF" opacity="0.49" /><circle cx="85" cy="76" r="1.4" fill="#FFFFFF" opacity="0.28" /><circle cx="501" cy="78" r="0.8" fill="#FFFFFF" opacity="0.52" /><circle cx="636" cy="62" r="1.6" fill="#FFFFFF" opacity="0.76" />

    <!-- Sparkle glitter -->
    <g transform="translate(870, 24) scale(0.9)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#F59E0B" opacity="0.9" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Icon & Titles -->
    <text x="28" y="36" class="title">22 nm 6T FinFET SRAM Cell — Area Scaling & Layout</text>
    <text x="28" y="58" class="tech">22nm FinFET • 6T SRAM • KLayout • SEMulator3D • Custom Compiler</text>

    <!-- Pill Status Badge -->
    <g transform="translate(740, 22)">
      <rect width="125" height="24" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#F59E0B" />
      <text x="24" y="16" class="badge-text">TAPEOUT READY</text>
    </g>

    <!-- Click to open prompt -->
    <text x="865" y="64" class="expand-hint" text-anchor="end">✦ TOUCH TO OPEN ▾</text>
  </g>
</svg>
