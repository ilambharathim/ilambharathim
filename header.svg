<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkle0 { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes twinkle1 { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.15; } }
      @keyframes twinkle2 { 0%, 100% { opacity: 0.3; } 35% { opacity: 1; } 70% { opacity: 0.4; } }
      @keyframes glitterPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.3) rotate(90deg); }
      }
      @keyframes circuitPulse {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes chipGlow {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.85)); }
      }
      @keyframes waveRun {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      .bg { fill: #070A12; }
      .circuit-base { stroke: #1E293B; stroke-width: 1.2; fill: none; }
      .circuit-glow-blue {
        stroke: #38BDF8;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 30 120;
        animation: circuitPulse 4s linear infinite;
        filter: drop-shadow(0 0 4px #38BDF8);
      }
      .circuit-glow-green {
        stroke: #34D399;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 25 100;
        animation: circuitPulse 5s linear infinite;
        filter: drop-shadow(0 0 4px #34D399);
      }
      .circuit-glow-purple {
        stroke: #A78BFA;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 20 80;
        animation: circuitPulse 3.5s linear infinite;
        filter: drop-shadow(0 0 4px #A78BFA);
      }

      .title-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 5px;
        fill: #FFFFFF;
        filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
      }
      .badge-tag {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        letter-spacing: 1.5px;
        fill: #38BDF8;
        font-weight: 700;
      }
      .title-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.6px;
        fill: #34D399;
      }
      .title-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 13.5px;
        letter-spacing: 0.3px;
        fill: #94A3B8;
      }
      .mono-label {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10px;
        fill: #64748B;
      }
    </style>

    <linearGradient id="nebula1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#1E1B4B" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#0C4A6E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="940" height="250" rx="12" class="bg" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="940" height="250" rx="12" fill="url(#nebula1)"/>
  <rect width="940" height="250" rx="12" fill="url(#coreGlow)"/>

  <!-- Twinkling Stars Layer -->
  <circle cx="669" cy="43" r="1.0" fill="#38BDF8" class="star" style="animation: twinkle0 2.2s ease-in-out 1.2s infinite;" />
    <circle cx="769" cy="41" r="1.8" fill="#FFFFFF" class="star" style="animation: twinkle1 1.9s ease-in-out 3.6s infinite;" />
    <circle cx="447" cy="23" r="1.0" fill="#FFFFFF" class="star" style="animation: twinkle2 2.7s ease-in-out 1.0s infinite;" />
    <circle cx="42" cy="158" r="1.2" fill="#FFFFFF" class="star" style="animation: twinkle0 2.7s ease-in-out 2.6s infinite;" />
    <circle cx="240" cy="129" r="1.7" fill="#38BDF8" class="star" style="animation: twinkle1 1.8s ease-in-out 3.3s infinite;" />
    <circle cx="840" cy="55" r="1.8" fill="#FFFFFF" class="star" style="animation: twinkle2 2.1s ease-in-out 1.4s infinite;" />
    <circle cx="796" cy="101" r="1.1" fill="#FFFFFF" class="star" style="animation: twinkle0 2.4s ease-in-out 1.6s infinite;" />
    <circle cx="367" cy="169" r="1.3" fill="#FFFFFF" class="star" style="animation: twinkle1 2.6s ease-in-out 0.3s infinite;" />
    <circle cx="142" cy="111" r="1.1" fill="#38BDF8" class="star" style="animation: twinkle2 2.9s ease-in-out 1.2s infinite;" />
    <circle cx="921" cy="235" r="1.4" fill="#FFFFFF" class="star" style="animation: twinkle0 1.9s ease-in-out 0.8s infinite;" />
    <circle cx="692" cy="73" r="1.9" fill="#FFFFFF" class="star" style="animation: twinkle1 3.3s ease-in-out 3.9s infinite;" />
    <circle cx="902" cy="40" r="1.5" fill="#FFFFFF" class="star" style="animation: twinkle2 3.2s ease-in-out 1.9s infinite;" />
    <circle cx="181" cy="109" r="1.4" fill="#38BDF8" class="star" style="animation: twinkle0 3.0s ease-in-out 2.7s infinite;" />
    <circle cx="714" cy="180" r="1.1" fill="#FFFFFF" class="star" style="animation: twinkle1 2.7s ease-in-out 2.6s infinite;" />
    <circle cx="265" cy="56" r="1.6" fill="#FFFFFF" class="star" style="animation: twinkle2 3.4s ease-in-out 1.2s infinite;" />
    <circle cx="719" cy="157" r="1.3" fill="#FFFFFF" class="star" style="animation: twinkle0 3.1s ease-in-out 1.4s infinite;" />
    <circle cx="72" cy="73" r="2.0" fill="#38BDF8" class="star" style="animation: twinkle1 2.5s ease-in-out 3.2s infinite;" />
    <circle cx="82" cy="69" r="2.1" fill="#FFFFFF" class="star" style="animation: twinkle2 3.0s ease-in-out 2.3s infinite;" />
    <circle cx="232" cy="182" r="1.6" fill="#FFFFFF" class="star" style="animation: twinkle0 2.9s ease-in-out 3.6s infinite;" />
    <circle cx="161" cy="82" r="1.2" fill="#FFFFFF" class="star" style="animation: twinkle1 2.7s ease-in-out 3.0s infinite;" />
    <circle cx="779" cy="164" r="1.5" fill="#38BDF8" class="star" style="animation: twinkle2 2.4s ease-in-out 2.4s infinite;" />
    <circle cx="156" cy="145" r="1.6" fill="#FFFFFF" class="star" style="animation: twinkle0 3.3s ease-in-out 3.0s infinite;" />
    <circle cx="171" cy="175" r="1.2" fill="#FFFFFF" class="star" style="animation: twinkle1 2.8s ease-in-out 2.8s infinite;" />
    <circle cx="409" cy="112" r="1.7" fill="#FFFFFF" class="star" style="animation: twinkle2 2.2s ease-in-out 1.9s infinite;" />
    <circle cx="581" cy="235" r="2.1" fill="#38BDF8" class="star" style="animation: twinkle0 2.0s ease-in-out 2.8s infinite;" />
    <circle cx="921" cy="152" r="1.9" fill="#FFFFFF" class="star" style="animation: twinkle1 2.4s ease-in-out 3.1s infinite;" />
    <circle cx="315" cy="126" r="1.2" fill="#FFFFFF" class="star" style="animation: twinkle2 3.0s ease-in-out 0.1s infinite;" />
    <circle cx="751" cy="82" r="2.2" fill="#FFFFFF" class="star" style="animation: twinkle0 2.7s ease-in-out 3.1s infinite;" />
    <circle cx="123" cy="175" r="1.4" fill="#38BDF8" class="star" style="animation: twinkle1 2.8s ease-in-out 2.6s infinite;" />
    <circle cx="171" cy="110" r="1.9" fill="#FFFFFF" class="star" style="animation: twinkle2 3.1s ease-in-out 2.2s infinite;" />
    <circle cx="558" cy="15" r="1.7" fill="#FFFFFF" class="star" style="animation: twinkle0 2.0s ease-in-out 2.0s infinite;" />
    <circle cx="386" cy="227" r="2.0" fill="#FFFFFF" class="star" style="animation: twinkle1 2.2s ease-in-out 1.0s infinite;" />
    <circle cx="595" cy="35" r="1.1" fill="#38BDF8" class="star" style="animation: twinkle2 1.9s ease-in-out 2.0s infinite;" />
    <circle cx="793" cy="151" r="1.9" fill="#FFFFFF" class="star" style="animation: twinkle0 2.6s ease-in-out 0.6s infinite;" />
    <circle cx="577" cy="57" r="1.3" fill="#FFFFFF" class="star" style="animation: twinkle1 2.5s ease-in-out 3.5s infinite;" />
    <circle cx="231" cy="153" r="1.9" fill="#FFFFFF" class="star" style="animation: twinkle2 3.0s ease-in-out 2.8s infinite;" />
    <circle cx="423" cy="186" r="1.8" fill="#38BDF8" class="star" style="animation: twinkle0 2.7s ease-in-out 1.8s infinite;" />
    <circle cx="138" cy="78" r="1.3" fill="#FFFFFF" class="star" style="animation: twinkle1 2.8s ease-in-out 1.4s infinite;" />
    <circle cx="250" cy="165" r="1.3" fill="#FFFFFF" class="star" style="animation: twinkle2 2.9s ease-in-out 0.4s infinite;" />
    <circle cx="249" cy="32" r="2.1" fill="#FFFFFF" class="star" style="animation: twinkle0 1.9s ease-in-out 3.5s infinite;" />
    

  <!-- Flashing Glitter Crosses -->
  <g transform="translate(180, 45) scale(1.2)" style="animation: glitterPulse 3s ease-in-out 0.5s infinite;">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#38BDF8" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    <g transform="translate(780, 40) scale(1.5)" style="animation: glitterPulse 3s ease-in-out 1.2s infinite;">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#38BDF8" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    <g transform="translate(620, 195) scale(1.0)" style="animation: glitterPulse 3s ease-in-out 2.0s infinite;">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#38BDF8" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    <g transform="translate(880, 170) scale(1.4)" style="animation: glitterPulse 3s ease-in-out 0.8s infinite;">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#38BDF8" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    <g transform="translate(110, 210) scale(1.1)" style="animation: glitterPulse 3s ease-in-out 1.8s infinite;">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#38BDF8" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    <g transform="translate(480, 25) scale(1.3)" style="animation: glitterPulse 3s ease-in-out 2.5s infinite;">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#38BDF8" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
    

  <!-- Interconnected Cosmic Circuit Traces -->
  <!-- Circuit 1: Upper right to center -->
  <path d="M 550 35 L 680 35 L 720 70 L 860 70" class="circuit-base" />
  <path d="M 550 35 L 680 35 L 720 70 L 860 70" class="circuit-glow-blue" />

  <!-- Circuit 2: Mid chip bus -->
  <path d="M 620 50 L 710 50 L 740 85 L 900 85" class="circuit-base" />
  <path d="M 620 50 L 710 50 L 740 85 L 900 85" class="circuit-glow-green" />

  <!-- Circuit 3: Bottom left constellation trace -->
  <path d="M 40 215 L 140 215 L 180 185 L 290 185" class="circuit-base" />
  <path d="M 40 215 L 140 215 L 180 185 L 290 185" class="circuit-glow-purple" />
  <circle cx="40" cy="215" r="3" fill="#A78BFA" />
  <circle cx="140" cy="215" r="2.5" fill="#FFFFFF" />
  <circle cx="180" cy="185" r="3" fill="#38BDF8" />
  <circle cx="290" cy="185" r="3.5" fill="#34D399" />

  <!-- Holographic Silicon Die Graphic on Right Side -->
  <g transform="translate(740, 100)" class="chip" style="animation: chipGlow 4s ease-in-out infinite;">
    <!-- Outer IC substrate -->
    <rect x="-65" y="-50" width="130" height="100" rx="8" fill="url(#chipGrad)" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- IC Corner Pins -->
    <circle cx="-55" cy="-40" r="2" fill="#34D399" />
    <circle cx="-55" cy="40" r="2" fill="#38BDF8" />
    <circle cx="55" cy="-40" r="2" fill="#A78BFA" />
    <circle cx="55" cy="40" r="2" fill="#FBBF24" />

    <!-- Silicon Core Die -->
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="#070A12" stroke="#34D399" stroke-width="1" />
    
    <!-- Die Labels -->
    <text x="0" y="-12" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#38BDF8" text-anchor="middle">POLARFIRE SoC</text>
    <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">RISC-V + SNN</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#34D399" text-anchor="middle">22nm FinFET</text>
    
    <!-- External Wire Bonds -->
    <line x1="-65" y1="-20" x2="-78" y2="-20" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="-65" y1="0" x2="-78" y2="0" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="-65" y1="20" x2="-78" y2="20" stroke="#38BDF8" stroke-width="1.5" />

    <line x1="65" y1="-20" x2="78" y2="-20" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="65" y1="0" x2="78" y2="0" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="65" y1="20" x2="78" y2="20" stroke="#38BDF8" stroke-width="1.5" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(45, 35)">
    <!-- Active Status Pill -->
    <rect width="190" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
    <circle cx="14" cy="12" r="4" fill="#34D399" style="animation: twinkle1 2s ease-in-out infinite;" />
    <text x="26" y="16" class="badge-tag">✧ SILICON &amp; RTL CORE</text>

    <!-- Main Name Heading with Space Glow -->
    <text x="0" y="72" class="title-name">ILAM BHARATHI</text>

    <!-- Subtitle -->
    <text x="2" y="102" class="title-sub">ECE Undergraduate • VLSI • RTL Design • FPGA • Hardware AI</text>

    <!-- Tagline -->
    <text x="2" y="126" class="title-desc">Architecting hardware systems from transistor circuits to intelligent edge accelerators.</text>
  </g>

  <!-- Bottom Separator with Gradient -->
  <line x1="45" y1="198" x2="895" y2="198" stroke="#1E293B" stroke-width="1" />

  <!-- Bottom Engineering Flow Badges -->
  <g transform="translate(45, 222)">
    <text x="0" y="0" class="mono-label" fill="#38BDF8" font-weight="bold">PIPELINE:</text>
    <text x="65" y="0" class="mono-label">SPEC ➔ RTL DESIGN ➔ SIMULATION ➔ SYNTHESIS ➔ VERIFICATION ➔ SILICON</text>
  </g>

  <!-- Bottom Waveform Clock in Lower Right -->
  <g transform="translate(650, 220)">
    <text x="-50" y="0" class="mono-label" fill="#34D399">CLK_EDGE</text>
    <path d="M 15 2 L 28 2 L 28 -8 L 41 -8 L 41 2 L 54 2 L 54 -8 L 67 -8 L 67 2 L 80 2 L 80 -8 L 93 -8 L 93 2 L 106 2 L 106 -8 L 119 -8 L 119 2 L 132 2 L 132 -8 L 145 -8 L 145 2 L 158 2 L 158 -8 L 171 -8 L 171 2 L 184 2 L 184 -8 L 197 -8 L 197 2 L 210 2" stroke="#38BDF8" stroke-width="1.5" fill="none" style="stroke-dasharray: 6 3; animation: waveRun 6s linear infinite;" />
  </g>
</svg>
