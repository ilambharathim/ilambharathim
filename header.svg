    <circle cx="916" cy="164" r="1.8" fill="#FFFFFF" style="animation: twinkleBright 2.9s ease-in-out 3.8s infinite;" filter="url(#starGlow)" />
    <circle cx="457" cy="15" r="0.8" fill="#94A3B8" opacity="0.4" />
