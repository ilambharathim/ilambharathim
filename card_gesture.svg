<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #EC4899; opacity: 0.7; }
        50% { stroke: #FFFFFF; opacity: 1; }
      }
      .card-bg {
        fill: #080D1A;
        stroke: #EC4899;
        stroke-width: 1.8;
        rx: 22px;
        filter: drop-shadow(0 4px 14px rgba(236, 72, 153, 0.5));
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.3px;
      }
      .tech {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #EC4899;
        letter-spacing: 1px;
      }
      .expand-hint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #EC4899;
        letter-spacing: 1px;
      }
    </style>

    <radialGradient id="nebula_gesture" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080D1A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Curvy Floating Cosmic Card Body -->
  <g style="animation: floatCard 4s ease-in-out infinite;">
    <rect x="3" y="3" width="894" height="80" class="card-bg" />
    <rect x="3" y="3" width="894" height="80" rx="22" fill="url(#nebula_gesture)" />
    
    <!-- Twinkling stars inside the card -->
    <circle cx="612" cy="80" r="1.2" fill="#FFFFFF" opacity="0.76" /><circle cx="224" cy="48" r="0.9" fill="#FFFFFF" opacity="0.44" /><circle cx="702" cy="46" r="1.1" fill="#FFFFFF" opacity="0.76" /><circle cx="89" cy="9" r="1.1" fill="#FFFFFF" opacity="0.8" /><circle cx="117" cy="17" r="1.2" fill="#FFFFFF" opacity="0.5" /><circle cx="150" cy="52" r="1.5" fill="#FFFFFF" opacity="0.73" /><circle cx="393" cy="44" r="0.8" fill="#FFFFFF" opacity="0.7" /><circle cx="735" cy="46" r="1.3" fill="#FFFFFF" opacity="0.79" /><circle cx="684" cy="75" r="0.7" fill="#FFFFFF" opacity="0.69" /><circle cx="321" cy="21" r="1.5" fill="#FFFFFF" opacity="0.28" /><circle cx="133" cy="21" r="1.4" fill="#FFFFFF" opacity="0.29" /><circle cx="303" cy="34" r="1.3" fill="#FFFFFF" opacity="0.32" /><circle cx="664" cy="41" r="1.2" fill="#FFFFFF" opacity="0.35" /><circle cx="881" cy="14" r="0.8" fill="#FFFFFF" opacity="0.45" />

    <!-- Sparkle glitter -->
    <g transform="translate(870, 24) scale(0.9)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7" fill="#EC4899" opacity="0.9" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Icon & Titles -->
    <text x="28" y="36" class="title">Gesture-to-Speech FPGA System</text>
    <text x="28" y="58" class="tech">Verilog HDL • AMD Xilinx Vivado • Synchronous FSM • Real-Time DSP</text>

    <!-- Pill Status Badge -->
    <g transform="translate(740, 22)">
      <rect width="125" height="24" rx="12" fill="#0F172A" stroke="#EC4899" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#EC4899" />
      <text x="24" y="16" class="badge-text">HARDWARE DEMO</text>
    </g>

    <!-- Click to open prompt -->
    <text x="865" y="64" class="expand-hint" text-anchor="end">✦ TOUCH TO OPEN ▾</text>
  </g>
</svg>
